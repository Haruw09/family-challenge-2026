# ШАБЛОН. Скопируй эту папку в submissions/<твоё_имя>/ и заполни поля.
# Папки, начинающиеся с "_" или ".", игнорируются скриптом — эта не в счёт.

name: Имя           # как хочешь, чтобы к тебе обращались
country: Страна     # страна, которую посетил(а)
lat: 0.0            # широта точки, где сделано фото
lon: 0.0            # долгота точки, где сделано фото
photo: photo.jpg    # имя файла фотографии, лежащего рядом в этой же папке
